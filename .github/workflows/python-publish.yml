name: Upload Python Package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = v2.5.0
          cd release_artifacts/2.5.0
          sha256sum --check SHA256SUMS
      - name: Linux OpenCV runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb1 libgl1 libglib2.0-0
      - name: Install and check the retained wheel
        run: |
          python -m pip install release_artifacts/2.5.0/*.whl pytest twine
          python -m twine check release_artifacts/2.5.0/*.whl release_artifacts/2.5.0/*.tar.gz
          python -I -m pytest -q tests
          python -I validation/platform_check.py --validation-dir validation --output release_validation
          amt-validated --help
          amt-refined --help
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            release_artifacts/2.5.0/*.whl
            release_artifacts/2.5.0/*.tar.gz
  pypi-publish:
    runs-on: ubuntu-latest
    needs: [verify-distributions]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/automorphotrack
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
