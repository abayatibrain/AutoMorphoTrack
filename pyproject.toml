[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automorphotrack"
version = "2.4.0"
description = "Automated pipeline for mitochondrial and lysosomal detection, tracking, morphology, and colocalization analysis in microscopy images."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Armin Bayati, Ph.D.", email = "a.bayati.brain@gmail.com"}
]
requires-python = ">=3.11"
keywords = ["image-processing", "microscopy", "organelle-tracking", "mitochondria", "lysosomes", "colocalization", "live-cell-imaging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "opencv-python>=4.6.0",
    "scikit-image>=0.25",
    "scipy>=1.13",
    "tifffile>=2024.8",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
compressed-tiff = ["imagecodecs>=2024.1"]
napari = [
    "napari>=0.4.18",
    "magicgui>=0.7.0",
    "qtpy>=2.3.0",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0", "twine>=4.0"]

[project.scripts]
automorphotrack-validated = "automorphotrack.validated.__main__:main"
amt-validated = "automorphotrack.validated.__main__:main"
automorphotrack = "automorphotrack.cli:main"
amt = "automorphotrack.cli:main"

[project.entry-points."napari.manifest"]
automorphotrack = "automorphotrack:napari.yaml"

[project.urls]
Documentation = "https://github.com/abayatibrain/AutoMorphoTrack"
Source = "https://github.com/abayatibrain/AutoMorphoTrack"
Tracker = "https://github.com/abayatibrain/AutoMorphoTrack/issues"

[tool.setuptools.packages.find]
include = ["automorphotrack*"]
exclude = ["build*", "dist*", "tests*", "examples*", "Jupyter*"]

[tool.setuptools.package-data]
automorphotrack = ["napari.yaml"]
